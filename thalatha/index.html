<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>٣</title>
  <meta name="description" content="٣ — كل مقالة عن ثلاثة أشياء: ثلاثة أنواع من الأمل، من السيارات، من الأصدقاء…">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Ctext x='32' y='47' font-size='44' font-weight='700' text-anchor='middle' fill='%23fff' font-family='Tahoma,Arial'%3E٣%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('thalatha-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="read-bar" id="readBar" hidden></div>
  <a class="skip" href="#app">تخطَّ إلى المحتوى</a>

  <header class="site-header">
    <div class="wrap">
      <div class="topbar">
        <a class="logo" href="#/" aria-label="٣ — الرئيسية">
          <span class="logo-num">٣</span><span class="logo-dot"></span>
        </a>
        <div class="top-actions">
          <button class="icon-btn" type="button" id="searchBtn" aria-label="بحث">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button class="btn btn-dark" type="button" data-open="subscribe"><span class="badge"></span>اشترك</button>
          <button class="btn btn-line" type="button" data-open="login">الدخول</button>
        </div>
      </div>
      <nav class="tabs" aria-label="الأقسام">
        <a href="#/" data-tab="home">الرئيسية</a>
        <a href="#/articles" data-tab="articles">المقالات</a>
        <a href="#/programs" data-tab="programs">البرامج</a>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <span>جميع الحقوق محفوظة لـ ٣ © <span id="year"></span></span>
      <button class="theme-btn" type="button" id="themeToggle">تبديل المظهر</button>
    </div>
  </footer>

  <!-- البحث -->
  <dialog class="sheet search-sheet" id="dlg-search" aria-label="بحث">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="search" placeholder="ابحث في المقالات…" autocomplete="off">
      <button class="btn btn-line" type="button" data-close>إغلاق</button>
    </div>
    <div class="list" id="searchResults"></div>
  </dialog>

  <!-- الاشتراك -->
  <dialog class="sheet" id="dlg-subscribe" aria-labelledby="subTitle">
    <button class="x" type="button" data-close aria-label="إغلاق">×</button>
    <h2 id="subTitle">اشترك في ٣</h2>
    <p class="muted">تصلك ثلاثية جديدة في بريدك، مجانًا.</p>
    <form class="form" data-form="subscribe" novalidate>
      <label for="subEmail">البريد الإلكتروني</label>
      <input id="subEmail" name="email" type="email" dir="ltr" placeholder="name@example.com" autocomplete="email">
      <button class="btn btn-dark btn-block" type="submit">اشترك</button>
      <p class="form-msg" role="status" aria-live="polite"></p>
    </form>
  </dialog>

  <!-- الدخول -->
  <dialog class="sheet" id="dlg-login" aria-labelledby="loginTitle">
    <button class="x" type="button" data-close aria-label="إغلاق">×</button>
    <h2 id="loginTitle">الدخول</h2>
    <p class="muted">نرسل لك رابط دخول إلى بريدك، بلا كلمة مرور.</p>
    <form class="form" data-form="login" novalidate>
      <label for="loginEmail">البريد الإلكتروني</label>
      <input id="loginEmail" name="email" type="email" dir="ltr" placeholder="name@example.com" autocomplete="email">
      <button class="btn btn-dark btn-block" type="submit">أرسل الرابط</button>
      <p class="form-msg" role="status" aria-live="polite"></p>
    </form>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
